services:

    client:
        build: 
            context: ./client
            args:
                VITE_APP_API_URL: http://localhost:5000
        ports:
            - "3000:3000"
        
            
    server:
        build: ./server
        ports:
            - "5000:5000"
        environment:
            - MONGO_URI=mongodb://mongo-db:27017/casasaberes
            - S3_ENDPOINT=http://seaweedfs:8333
            - S3_ACCESS_KEY=${S3_ACCESS_KEY}
            - S3_SECRET_KEY=${S3_SECRET_KEY}
            - S3_BUCKET=${S3_BUCKET}
            - S3_REGION=${S3_REGION}
            - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
            - JWT_SECRET=${JWT_SECRET}
        depends_on:
            - mongo-db
            - seaweedfs
            - create-bucket

    mongo-db:
        image: mongo:7
        volumes:
            - mongo_data:/data/db
    
    seaweedfs:
        image: 'chrislusf/seaweedfs:latest'
        command: 'server -s3 -s3.port=8333 -dir=/data -ip.bind=0.0.0.0'
        volumes:
            - seaweed_data:/data
        ports:
            - "8333:8333"

    create-bucket:
        image: amazon/aws-cli
        depends_on:
            - seaweedfs
        environment:
            - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
            - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
        entrypoint: >
            sh -c "
            sleep 15 &&
            aws --endpoint-url http://seaweedfs:8333 s3 mb s3://pdfs --region us-east-1 || true
            "
        
volumes:
    mongo_data:
    seaweed_data:

